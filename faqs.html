/* ============================================================
   COUNTERCULTURE — DESIGN TOKENS
   Layout, section order, copy and visual identity are preserved
   exactly from the source mockup. Only interaction, animation
   and functionality have been added on top — nothing redesigned.
   ============================================================ */
/* ============================================================
   EMBEDDED FONTS — Public Sans, PP Editorial New, Linotype Felt Pen
   ============================================================ */















:root{
  --black: #0a0a0a;
  --white: #ffffff;
  --red: #992828;
  --maroon: #992828; /* unified with --red so every red accent on the page matches exactly */
  --grey-light: #b4b3b3;
  --grey-dark: #595757;
  --grey-line: rgba(255,255,255,0.18);
  --font-body: 'Public Sans', ui-sans-serif, system-ui, sans-serif;
  --font-display: 'PP Editorial New', 'Playfair Display', Georgia, serif;
  --font-script: 'Linotype Felt Pen', 'Caveat', cursive;
  --font-faq: 'Extenda 40 Hecto', var(--font-body);
  --font-handscript: 'Have Heart One', var(--font-script);
  --font-brunson: 'Brunson', var(--font-handscript);
  --font-newaustin: 'New Austin', var(--font-script);
  --ease-out: cubic-bezier(.16,.8,.24,1);
  --ease-in-out: cubic-bezier(.65,0,.35,1);
  --dur-fast: 300ms;
  --dur-med: 500ms;
  --dur-slow: 900ms;
  --nav-h: 60px;
  --hero-h: 360px;
  --carousel-card-w: min(560px, calc(100vw - 48px));
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* FLUID MEDIA: images and videos never exceed their container and keep
   their aspect ratio automatically at every viewport width. */
img{max-width:100%;height:auto;display:block;}
video{max-width:100%;height:auto;display:block;}
a{color:inherit;}
button{font-family:inherit;}
/* Animations/transitions are intentionally disabled site-wide for now.
   Add them back in deliberately later if/when wanted. */
*{animation:none !important; animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition:none !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}

/* ---------- 1. NAV ---------- */
.navbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  min-height:var(--nav-h);
  display:flex; align-items:center; justify-content:center;
  background:transparent;
  backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
  transition:background var(--dur-med) var(--ease-in-out), backdrop-filter var(--dur-med) var(--ease-in-out);
}
.navbar.scrolled{
  background:rgba(10,10,10,0.72);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}

/* Desktop/tablet (default): unchanged — plain centered horizontal link
   row, no logo, no toggle. The logo+hamburger dropdown below is
   phone-only (see the max-width:640px block). */
.navbar__bar{ display:none; }
.navbar__list{
  list-style:none; display:flex; gap:clamp(14px,3vw,36px);
  margin:0; padding:0 16px; flex-wrap:wrap; justify-content:center;
  width:100%;
}
.navbar__link{
  font-family:var(--font-body);
  text-decoration:none; font-size:11px; letter-spacing:0.08em; font-weight:600;
  color:var(--maroon); opacity:0.7; position:relative; padding:4px 2px;
  white-space:nowrap;
  transition:opacity var(--dur-fast) var(--ease-out), color var(--dur-med) var(--ease-in-out);
}
.navbar.scrolled .navbar__link{ color:var(--white); }
.navbar__link::after{
  content:''; position:absolute; left:0; right:100%; bottom:-4px; height:1px;
  background:var(--maroon); transition:right var(--dur-fast) var(--ease-out), background var(--dur-med) var(--ease-in-out);
}
.navbar__link:hover{ opacity:1; color:var(--maroon); }
.navbar__link.active{ opacity:1; color:var(--maroon); }
.navbar__link.active::after{ right:0; }

/* ---------- 1b. NAV — tablet: same row, tighter gaps as it narrows ---------- */
@media (max-width:900px) and (min-width:641px){
  .navbar__list{ gap:clamp(8px,2.2vw,20px); padding:0 12px; }
  .navbar__link{ font-size:10.5px; }
}

/* ---------- 1c. NAV — phone only ----------
   Default (still at nav + hero): full link list shown inline,
   wrapped 3-per-row, no logo/hamburger — matches desktop/tablet
   behavior, just wrapped for a narrow screen.
   Once scrolled into the mission section and beyond
   (.navbar--compact is added by JS): switches to the small
   logo-left / hamburger-right dropdown pattern.
------------------------------------------------------------- */
@media (max-width:640px){
  .navbar__bar{ display:none; }

  /* --- default: inline 3-per-row list --- */
  .navbar__list{
    list-style:none; display:flex; flex-wrap:wrap;
    justify-content:center; align-content:center;
    gap:6px 4px; margin:0; padding:8px 10px; width:100%;
    position:static; visibility:visible; opacity:1; transform:none;
    background:none; border:0; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    transition:none;
  }
  .navbar__link{
    flex:0 0 calc(33.333% - 4px);
    box-sizing:border-box; text-align:center;
    font-size:10px; letter-spacing:0.05em; font-weight:600;
    padding:5px 2px; white-space:normal;
  }
  .navbar__link::after{ content:none; }

  /* --- compact: logo + hamburger, list becomes a dropdown --- */
  .navbar.navbar--compact .navbar__bar{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:0 16px; min-height:var(--nav-h);
  }
  .navbar--compact .navbar__logo{ display:flex; align-items:center; line-height:0; }
  .navbar--compact .navbar__logo img{ height:26px; width:auto; display:block; }
  .navbar--compact .navbar__toggle{
    appearance:none; background:none; border:0; margin:0; padding:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; line-height:1; color:var(--maroon); cursor:pointer;
    transition:color var(--dur-med) var(--ease-in-out);
  }
  .navbar.navbar--compact.scrolled .navbar__toggle{ color:var(--white); }

  .navbar.navbar--compact .navbar__list{
    padding:10px 14px 14px;
    position:absolute; top:100%; right:12px; z-index:101;
    flex-direction:column; flex-wrap:nowrap; gap:2px;
    min-width:220px; max-width:calc(100vw - 32px); width:auto;
    background:rgba(10,10,10,0.94);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), visibility 0s linear var(--dur-fast);
  }
  .navbar.navbar--compact.is-open .navbar__list{
    opacity:1; visibility:visible; transform:translateY(0);
    transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), visibility 0s;
  }
  .navbar--compact .navbar__link{
    flex:none;
    font-size:11.5px; letter-spacing:0.06em; font-weight:600;
    color:var(--white); opacity:0.85; position:relative; padding:10px 8px;
    text-align:left; white-space:normal; display:block; border-radius:6px;
  }
  .navbar--compact .navbar__link:hover{ opacity:1; color:var(--maroon); background-color:rgba(255,255,255,0.06); }
  .navbar--compact .navbar__link.active{ opacity:1; color:var(--maroon); }
}

/* Very narrow phones: keep the big display headers from wrapping awkwardly */
@media (max-width:400px){
  .culture__title, .timeline__eyebrow, .giving__title, .faqsec__title, .believesec__title{
    font-size:32px;
  }
}

/* All big display headers share the same tight line-height (0.95) and a
   display font with tall ascenders — give them a hair of top padding so
   the very top of the glyphs never grazes/feels clipped by the section
   edge or the fixed nav bar above it. Purely defensive, no visual change
   to the design otherwise. */
.culture__title, .timeline__eyebrow, .giving__title, .faqsec__title, .believesec__title{
  padding-top:0.12em;
}

/* ---------- SECTION HEADERS — text (converted back from GIF/PNG) ----------
   Each header pairs a bold uppercase word set in Brunson (light grey)
   with an italic title-case word set in PP Editorial New (maroon).
   "Our Story" is the one exception — both words use the italic maroon
   PP Editorial treatment, just at two different sizes. Spacing here
   (gap, letter-spacing, sizing) matches the reference build: the
   accent word is NOT shrunk down — it reads at the same size as the
   header around it, separated by ordinary word-spacing rather than
   an overlap. */
.hdr-duo{ display:flex; flex-wrap:wrap; align-items:baseline; gap:0.18em; }
.hdr-duo__main{ line-height:0.95; } /* inherits its section's display size */
.hdr-duo__accent{ line-height:0.95; } /* same size as the main word — no shrink, no overlap */
.hdr-duo__brunson{
  font-family:var(--font-brunson), var(--font-handscript);
  font-weight:400; font-style:normal;
  text-transform:uppercase; letter-spacing:normal;
  color:#CCCCCC;
}
.hdr-duo__editorial{
  font-family:var(--font-display);
  font-weight:400; font-style:italic;
  text-transform:capitalize;
  color:#800020;
}
.pastors__title{
  font-family:var(--font-brunson), var(--font-handscript); font-size:clamp(40px, 7vw, 64px);
  font-weight:400; line-height:0.95; letter-spacing:-0.08em; margin:0 0 22px;
  align-self:flex-start;
}


/* ---------- 2. HERO ---------- */
/* Hero sits in normal document flow, same as every other section —
   no fixed/pinned positioning, no z-index stacking tricks. The page
   simply scrolls past it like any other section. */
.hero{
  position:relative; width:100%;
  background:var(--black); color:var(--white);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  padding:0;
  height:100vh; height:100dvh; min-height:520px;
}
/* Replaceable background media (GIF or video) behind the hero logo.
   Swap the <img>/<video> source inside #heroBg (see markup below) —
   this layer just needs to fill the hero and sit behind everything. */
.hero__bg{
  position:absolute; inset:0; z-index:0; overflow:hidden;
}
.hero__bg img,
.hero__bg video{
  width:100%; height:100%; object-fit:cover; display:block;
}
/* Dark scrim over the landing GIF so any future overlaid text/nav stays readable */
.hero__scrim{
  position:absolute; inset:0; z-index:1;
  background:rgba(10,10,10,0.35);
  pointer-events:none;
}
.hero__logo-slot{ width:min(640px, 82vw); }
.hero__logo-slot img{width:100%;height:auto;}

/* ---------- 3. MISSION (photo + GIF, static — no parallax/scroll animation) ---------- */
.mission{ position:relative; background:#000; overflow:hidden; height:100vh; height:100dvh; min-height:520px; }
/* Background photo sits in the section's own normal stacking context
   (no background-attachment:fixed) — it scrolls with the page like
   everything else, it just isn't visible past this section's edges. */
.mission-photo{
  position:absolute; inset:0; z-index:0; overflow:hidden;
}
.mission-photo__img{
  width:100%; height:100%; object-fit:cover; object-position:center; display:block;
}
.mission__gif{
  display:block;
  width:100%;
  max-width:min(760px, 86vw);
  height:auto;
}
@media (max-width:760px){
  .mission{
    height:auto; min-height:0;
    aspect-ratio:16/9; /* matches a landscape GIF's natural shape instead of stretching tall */
  }
  .mission__gif{ width:100%; max-width:92vw; }
}

/* ---------- 4. VISION ---------- */
.vision{ padding:100px 24px 70px; background:#18191b; text-align:left; }
.vision__grid{
  max-width:1180px; margin:0 auto;
  display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(280px, 0.95fr);
  gap:clamp(1.25rem, 3vw, 2.5rem); align-items:center; overflow:hidden; min-width:0;
}
@media (max-width:860px) and (min-width:761px){
  .vision__grid{ grid-template-columns:0.95fr 1.15fr; gap:16px; }
}
/* Phones: stop squeezing three columns into one row. Stack the
   RAISE/REACH/REVIVAL block on top of the paragraph as a single,
   full-width rectangular column with room to breathe. */
@media (max-width:760px){
  .vision{ padding:64px 22px 56px; }
  .vision__grid{
    display:flex; flex-direction:column; gap:24px;
    max-width:520px; margin:0 auto;
  }
  .vision__left{ height:auto; padding-bottom:0; }
  .vision__block{ height:auto; }
  .vision__gif-img{ height:auto; max-height:260px; width:auto; max-width:220px; margin:0; }
  .vision__right{ width:100%; }
  .vision__copy{ font-size:20px; line-height:1.65; text-align:left; }
}
.vision__left{ display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.vision__block{ display:flex; align-items:flex-start; justify-content:flex-start; position:relative; width:100%; padding-left:clamp(4px,2vw,20px); }
/* The GIF is pre-cropped tight to its own content (no more blank
   canvas baked into the file), so it can simply fill the available
   column height and stay flush against the left edge — matching the
   paragraph column's height instead of floating in a mostly-empty box. */
.vision__gif-img{
  display:block;
  height:100%;
  width:auto;
  max-width:100%;
  object-fit:contain;
  object-position:left top;
}
.vision__copy:last-child{ margin-bottom:0; }
.vision__copy strong{ font-weight:800; color:var(--white); }
.vision__highlight{ color:var(--grey-light); font-weight:700; }

/* Main statement — the lead paragraph, set apart as the headline thought */
.vision__copy--main{
  font-size:clamp(20px, 1.85vw, 21px);
  line-height: 1.5;
  font-weight:400;
  color:var(--grey-light);
  margin-bottom:1px;
}
/* Supporting statements — smaller, quieter, and set off with a thin
   accent rule instead of a bullet or dash (matches the divider motif
   used elsewhere on the page). */
.vision__copy--sub{
  font: size 17px;
  line-height:1.5;
  color:rgba(255,255,255,0.58);
  padding-left:18px;
  border-left:2px solid var(--maroon);
  margin-bottom:1.2em;
}
.vision__copy--sub:last-child{ margin-bottom:0; }
@media (max-width:760px){
  .vision__copy--main{ font: size 22px; line-height: 1.5; }
  .vision__copy--sub{ font-size:13px; padding-left:10px; }
}

/* Vision mission statement (replaces vision.gif) — three handwritten
   lead-ins in New Austin (red, slanted) each paired with a bold
   Brunson word that cycles through a short list. Spacing (gap between
   lines, overlap onto the word beneath) matches the reference build. */
.vision__mission-text{
  display:flex; flex-direction:column; justify-content:center;
  width:100%; gap:2.5rem;
}
.vision__hand-line{ margin:0; display:flex; flex-direction:column; align-items:flex-start; }
.vision__hand{
  font-family:var(--font-newaustin), var(--font-script);
  color:var(--maroon); font-style:italic;
  display:inline-block; transform:rotate(-0deg); transform-origin:left bottom;
  font-size:clamp(22px, 3vw, 34px); line-height:1; margin:0 0 -12px;
}
.vision__word{
  font-family:var(--font-brunson), var(--font-handscript);
  color:var(--grey-light); text-transform:uppercase;
  font-size:clamp(100px, 4.4vw, 68px); line-height: 1.30; letter-spacing:-0.01em;
  display:inline-block; opacity:1; transform:translateY(0);
  transition:opacity 0.01s linear, transform 0.02s linear;
}
.vision__word.is-swapping{ opacity:0; transform:translateY(-6px); }
@media (max-width:760px){
  .vision__hand{ font-size:clamp(18px,5vw,26px); }
  .vision__word{ font-size:clamp(24px,8vw,36px); }
}

/* ---------- 5. CULTURE CODE ----------
   The whole section (header + carousel + controls) is built as a
   flex column pinned to exactly one viewport's height, so nothing
   ever gets cut off by the screen edge on any device: the header
   and controls take only the space their content needs, and the
   carousel viewport absorbs whatever's left. Card padding/type use
   vh-based clamps so they shrink gracefully on short screens instead
   of overflowing, and each card can scroll internally as a last
   resort so no content is ever unreachable. */
.culture-pin{ position:relative; }
.culture{
  position:sticky; top:0;
  height:100vh; height:100dvh; min-height:520px;
  display:flex; flex-direction:column;
  padding:calc(var(--nav-h) + clamp(14px,3.4vh,40px)) 0 clamp(16px,4vh,36px);
  background:var(--black); overflow-x:hidden;
}
.culture__head{ flex:0 0 auto; max-width:1100px; width:100%; margin:0 auto clamp(10px,2vh,20px); padding:0 24px; }
.culture__title{ font-family:var(--font-display); font-size:clamp(26px, 5.2vh, 64px); font-weight:400; line-height:1; letter-spacing:-0.08em; margin:0 0 clamp(6px,1.4vh,12px); color:var(--grey-light); }
.culture__title em{ font-style:italic; font-weight:400; color:var(--maroon); }
/* Culture Code header is now a GIF instead of type */
.culture__title-gif{ display:block; width:auto; max-width:min(360px, 60vw); height:auto; margin:0 0 clamp(6px,1.4vh,12px); }
.culture__sub{
  font-size:clamp(13px, 1.7vh, 16px); line-height:1.5; letter-spacing:0.005em;
  color:var(--grey-light); margin:0; max-width:1100px;
}
.culture__carousel{
  position:relative; width:100%; flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; justify-content:center;
  background:var(--black);
}
.culture__viewport{ flex:1 1 auto; min-height:0; overflow:hidden; }
.culture__track{
  display:flex; align-items:center; gap:28px; height:100%;
  /* 50% (of the actual .culture__viewport container) instead of 50vw
     (the window) — 50vw assumes the viewport is exactly window-width,
     which isn't always true (scrollbars, etc.), and was the reason the
     last card (10) could end up landing near the edge instead of dead
     center. 50% always matches the real container width JS scrolls
     against, so every card — first and last included — centers exactly. */
  padding:2px calc(50% - (var(--carousel-card-w) / 2));
  will-change:transform;
}
.culture-card{
  flex:0 0 var(--carousel-card-w);
  display:flex; flex-direction:column;
  background:rgba(255,255,255,0.03); border:1px solid var(--grey-line); border-radius:4px;
  padding:clamp(14px,2.2vh,22px) clamp(16px,2.4vw,28px) clamp(12px,1.8vh,18px);
  color:var(--white); opacity:0.4;
  transition:opacity 650ms var(--ease-out), border-color 650ms var(--ease-out), box-shadow 650ms var(--ease-out);
  position:relative; overflow:hidden; z-index:0;
  /* Height is set by JS (sizeCultureCards) to the tallest card's natural
     content height, applied equally to every card — so all cards share
     one fixed box size, switching cards never resizes anything, and no
     card's text ever needs to scroll to be fully read. */
}
.culture-card.is-active{
  opacity:1; border-color:rgba(255,255,255,0.5);
  z-index:2;
  box-shadow:0 24px 60px rgba(0,0,0,0.45);
}
.culture-card__num{ position:absolute; right:28px; bottom:16px; font-family:var(--font-display); font-size:clamp(50px, 8vh, 120px); font-weight:800; color:rgba(255,255,255,0.1); line-height:1; pointer-events:none; }
.culture-card.is-active .culture-card__num{ color:rgba(255,255,255,0.22); }
.culture-card__title{ font-family:var(--font-body); font-size:clamp(20px, 3.6vh, 36px); font-weight:800; text-transform:uppercase; margin:0 0 clamp(4px,0.8vh,8px); letter-spacing:0.01em; flex:0 0 auto; }
.culture-card__desc{
  font-size:clamp(14px, 2vh, 19px); line-height:1.6; color:rgba(255,255,255,0.65);
  max-width:88%; flex:0 1 auto;
  transition:color var(--dur-med) var(--ease-out);
}
.culture-card.is-active .culture-card__desc{ color:rgba(255,255,255,0.85); }
.culture-card--summary .culture-card__desc{ max-width:100%; font-weight:600; letter-spacing:0.01em; }
.culture-card__divider{
  height:1px; background:rgba(255,255,255,0.15); margin:0 0 clamp(10px,1.8vh,20px);
  transition:background var(--dur-med) var(--ease-out); flex:0 0 auto;
}
.culture-card.is-active .culture-card__divider{ background:rgba(255,255,255,0.6); }
.culture-card__verses{ display:flex; flex-wrap:wrap; gap:6px 16px; flex:0 0 auto; }
.culture-card__verse{
  display:inline-block; font-size:clamp(12px, 1.6vh, 15px); letter-spacing:0.02em;
  text-decoration:underline; text-underline-offset:3px; color:var(--white); opacity:0.85;
}
.culture-card__verse:hover{ opacity:1; color:var(--maroon); }
/* Phones: narrower cards; everything else already scales via the
   vh-based clamps above, so no separate height-fitting rules are
   needed here anymore. */
@media (max-width:760px){
  :root{ --carousel-card-w: min(88vw, 440px); }
  .culture__head{ padding:0 20px; margin-bottom:clamp(10px,2.2vh,20px); }
  .culture__sub{ font-size:clamp(12px, 1.5vh, 14px); line-height:1.4; }
  .culture-card__num{ font-size:clamp(30px, 6vh, 56px); right:16px; bottom:10px; } /* smaller instead of hidden, so it still reads as a numbered set on small screens */
  .culture-card{ padding:clamp(14px,2.4vh,24px) clamp(16px,4vw,28px) clamp(12px,2vh,20px); }
  .culture-card__title{ font-size:clamp(17px, 3vh, 24px); margin-bottom:clamp(8px,1.2vh,14px); }
  .culture-card__desc{ font-size:clamp(13px, 1.7vh, 15px); line-height:1.5; max-width:100%; }
  .culture__track{ gap:16px; }
}
.culture__controls{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:20px; padding-top:clamp(6px,1.6vh,14px); }
.culture__arrow{
  width:34px;height:34px;border-radius:50%; border:1px solid var(--grey-line); background:transparent;
  color:var(--white); display:flex;align-items:center;justify-content:center; cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.culture__arrow:hover{background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.5);}
.culture__dots{display:flex; gap:8px;}
.culture__dot{ width:7px;height:7px;border-radius:50%; background:rgba(255,255,255,0.3); border:none; cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.culture__dot.active{background:var(--white); transform:scale(1.3);}

/* ---------- 6. OUR STORY (black section) ---------- */
.pastors{ background:var(--black); color:var(--white); padding:70px 24px 120px; overflow:hidden; position:relative; }
.pastors__inner{ max-width:1100px; margin:0 auto; display:grid; grid-template-columns:1fr 1.15fr; gap:64px; align-items:start; }
@media (max-width:760px){ .pastors__inner{ grid-template-columns:1fr; } }
.pastors__photo-wrap{ position:relative; overflow:visible; }
@media (max-width:760px){
  .pastors__photo-wrap{ aspect-ratio:4/5; } /* JS doesn't set a height on mobile (stacked layout) */
}
.pastors__photo-wrap .pastors__photo{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1); }
.pastors__caption{
  position:absolute; top:-6%; left:-4%; right:auto;
  font-family:var(--font-script); font-style:normal; font-weight:600;
  color:var(--maroon); font-size:clamp(34px,5.4vw,60px);
  transform:rotate(-7deg);
  line-height:1.05;
  text-align:left;
  white-space:nowrap;
  text-shadow:0 0 1px rgba(255,255,255,0.4);
}
/* Handwritten "Revival with you" accent — now live text (New Austin,
   title case, maroon), overlapping the top-left corner of the photo,
   nudged down a touch from the very edge so it doesn't feel clipped */
.pastors__handwritten-png{
  position:absolute; top:4%; left:-6%; right:auto;
  width:auto; max-width:60%;
  font-family:var(--font-newaustin), var(--font-script);
  font-style:normal; font-weight:400;
  text-transform:none; /* title case, not uppercase */
  color:var(--maroon);
  line-height:0.9;
  transform:rotate(-8deg);
  text-align:left;
  white-space:nowrap;
  display:flex; flex-direction:column;
  z-index:3; pointer-events:none;
}
.pastors__handwritten-line1{ font-size:clamp(38px, 5.4vw, 62px); }
.pastors__handwritten-line2{ font-size:clamp(26px, 3.8vw, 44px); align-self:flex-end; margin-top:-0.1em; }
/* 4th Our Story attachment — "our story" corner label, sits in the
   bottom-left corner just above the photo (overlapping it) */
.pastors__accent-png{
  position:absolute; bottom: -90px; left: 04%; right: 300px;
  width: clamp(17px,-10px, 100px); height: 170px;;
  z-index: index 9; pointer-events:none;
}
/* Height is set by JS (sizePastorsColumn) to match the photo's actual
   rendered height on desktop — but only as a min-height, so if the bio
   text ever needs more room than the photo provides, it simply grows
   past it instead of being cut off. justify-content:space-between then
   pins the title to the top and lets the bio settle at the bottom,
   lining up with the photo's bottom edge when there's room to do so. */
.pastors__col-right{ display:flex; flex-direction:column; justify-content:space-between; position:relative; z-index:1; }
@media (max-width:520px){
  .pastors__caption{ font-size:clamp(36px,12vw,48px); white-space:normal; top:-4%; left:0; }
  .pastors__handwritten-png{ top:2%; left:-2%; right:auto; }
  .pastors__handwritten-line1{ font-size:clamp(30px,10vw,40px); }
  .pastors__handwritten-line2{ font-size:clamp(20px,7vw,28px); }
}
.pastors__bio{ font-size:17px; font-family:var(--font-body); }
.pastors__bio p{ font-size:1em; line-height:1.85; color:var(--grey-light); margin:0 0 22px; letter-spacing:0.003em; }

/* ---------- 6b. WHAT'S NEXT rises up over OUR STORY as it arrives ---------- */
/* (Our Story itself is left untouched — no blur/dim.) */

/* ---------- 7. WHAT'S NEXT / TIMELINE ---------- */
.timeline{
  padding: 50px 24px 25px; background:var(--black); max-width:1100px; margin: 20px auto;
  position:relative; z-index:2;
}
.timeline__eyebrow{ font-family:var(--font-display); font-size:clamp(40px,7vw,64px); font-weight:400; line-height:0.95; letter-spacing:-0.08em; margin:0 0 16px; color:var(--grey-light); }
.timeline__eyebrow em{ font-style:italic; font-weight:400; color:var(--maroon); }
.timeline__intro{ font-size:16px; line-height:1.8; color:var(--grey-light); font-weight:400; margin-bottom:36px; font-family:var(--font-body); }

/* Weekly Community Encounter — bordered callout box, sits under the intro copy
   and above the 2026-2027 timeline. */
.timeline__weekly-box{
  border:1px solid rgba(255,255,255,0.22); border-radius:16px;
  padding:30px 32px; margin:0 0 44px;
  background:rgba(255,255,255,0.02);
}
.timeline__weekly-title{
  font-family:var(--font-body); font-size:clamp(35px,2.6vw,40px); font-weight:800; letter-spacing:0.03em; text-transform:uppercase;
  color:var(--white); margin:0 0 14px;
  }
.timeline__weekly-subhead{
 font-family:var(--font-body); font-size:15px; font-weight:800; color:var(--M); margin:0 0 3px; letter-spacing:0; 
}
.timeline__weekly-desc{
  font-family:var(--font-body); font-size:15.5px; line-height:1.8; color:var(--grey-light); font-weight:400; margin:0;
}

.timeline__year{
  font-size:20px; font-weight:800; letter-spacing:0.04em; padding-bottom:12px; margin:0 0 6px;
  color:var(--maroon); border-bottom:2px solid var(--maroon);
}
.timeline__cols{ display:grid; grid-template-columns:1fr 1fr; gap:56px; }
@media (max-width:720px){ .timeline__cols{grid-template-columns:1fr; gap:34px;} }
.acc-item{border-bottom:1px solid var(--grey-line);}
.acc-item__trigger{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:none; border:none; color:var(--white); text-align:left; padding:17px 2px;
  font-size:14.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer;
}
.acc-item__icon{ position:relative; width:10px;height:10px;flex:0 0 auto;margin-left:16px; }
.acc-item__icon::before,.acc-item__icon::after{
  content:''; position:absolute; background:var(--white); top:50%; left:50%; transform:translate(-50%,-50%);
  transition:transform var(--dur-fast) var(--ease-out);
}
.acc-item__icon::before{width:10px;height:1px;}

.acc-item__panel{ height:0; overflow:hidden; transition:height var(--dur-fast) var(--ease-in-out); }
.acc-item__panel-inner{ padding:0 2px 18px; font-size:14.5px; line-height:1.75; color:rgba(255,255,255,0.72); }
.timeline__cols .acc-item__trigger{ font-size:17px; padding:19px 2px; }
.timeline__cols .acc-item__panel-inner{ font-size:14.5px; line-height:1.75; }
.timeline__vin{ margin-top:44px; max-width:100%; }
.timeline__vin-subhead{ font-family:var(--font-body); font-size:clamp(35px,2.6vw,40px); font-weight:800; margin:0 0 14px; color:var(--white); text-transform:uppercase; letter-spacing:0.03em; }
.timeline__vin-desc{ font-family:var(--font-body); font-size:16px; line-height:1.8; color:var(--grey-light); font-weight:400; margin:0; max-width:900px; }

/* Next in-person gathering — callout card under the VIN description */
.timeline__next{

  margin-top:26px;

}
.timeline__next-icon{ flex:0 0 auto; width:38px; height:38px; margin-top:2px; color:var(--maroon); }
.timeline__next-icon svg{ width:100%; height:100%; }
.timeline__next-body{ flex:1 1 auto; min-width:0; }
.timeline__next-eyebrow{ font-family:var(--font-body); font-size:12.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--maroon); margin:0 0 8px; }
.timeline__next-when{ font-family:var(--font-body); font-size:15px; font-weight:800; color:var(--white); margin:0 0 3px; letter-spacing:0.01em; }

}
.timeline__cta{

  margin:26px 0 0; padding:13px 30px;
  font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  color:#9f9f9f; text-decoration:none;

}

/* Reusable "shadowlike city" backdrop — same grayscale treatment as
   .mission-photo, used anywhere a section wants that grungy Quezon City
   photo behind its content (Ways To Give, Footer). Swap the
   background-image per usage if you want a different photo. */
.shadow-city-bg{
  position:absolute; inset:0; z-index:0; overflow:hidden;
  background-image:url('qc.png');
  background-size:cover;
  background-position:center;
  filter:grayscale(1) contrast(1.15) brightness(0.45);
  pointer-events:none;
}

/* ---------- 8. WAYS TO GIVE ---------- */
.giving{
  background:var(--black); padding:20px 24px 40px;
  position:relative; z-index:2; overflow:hidden;
  transition: transform 0.7s var(--ease-out);
}
.giving > .shadow-city-bg{ opacity:0.45; }
@media (max-width:760px){ .giving{ padding:40px 20px 64px; } }.giving__inner{ max-width:1100px; margin:0 auto; position:relative; z-index:1; }
.giving__title{ font-family:var(--font-display); font-size:clamp(40px,7vw,64px); font-weight:400; line-height:0.95; letter-spacing:-0.08em; margin:0 0 46px; color:var(--grey-light); }
.giving__title em{ font-style:italic; font-weight:400; color:var(--maroon); }
.giving__grid{ display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start; }
@media (max-width:760px){ .giving__grid{ grid-template-columns:1fr; } }
.giving__left{ display:flex; flex-direction:column; gap:62px; align-items:stretch; }
.giving__contact-heading{
  font-family:var(--font-body); font-weight:400; text-transform:none;
  color:var(--grey-light); font-size:clamp(15px,1.6vw,17px); line-height:1.6;
  letter-spacing:0.01em; margin:0;
}
.giving__content{ max-width:560px; font-size:16px; line-height:1.8; color:rgba(255,255,255,0.78); }
.giving__eyebrow{ font-family:var(--font-body); font-size:clamp(20px, 2.6vw, 25px); font-weight:800; letter-spacing:0.01em; color:var(--grey-dark); margin-bottom:18px; text-transform:uppercase; }
.giving__intro{ margin:0 0 26px; font-size:16px; line-height:1.8; color:var(--grey-light); font-family:var(--font-body); text-align:justify; }
.giving__block{ margin-bottom:15px; }
.giving__block strong{ display:block; color:var(--white); font-size:16px; margin-bottom:10px; }
.giving__block em{ font-style:italic; color:var(--white); }

/* ---------- Ways to Give: EMAIL / WHATSAPP contact blocks (left column) ---------- */
.contact-block{
  position:relative; overflow:hidden;
  border:1px solid var(--grey-line); border-radius:14px;
  padding:18px 22px 20px; min-height:150px;
}
.contact-block__watermark{
  position:absolute; top:14px; left:18px; z-index:1;
  font-family:var(--font-body); font-weight:800; text-transform:uppercase;
  color:var(--grey-dark); font-size:clamp(30px,4.4vw,44px); line-height:1;
  letter-spacing:-0.01em; pointer-events:none; user-select:none;
}
.contact-block__icon{
  position:absolute; top:16px; right:18px; z-index:2;
  width:24px; height:24px; color:var(--red);
}
.contact-block__body{
  position:relative; z-index:2; display:flex; flex-direction:column; gap:8px;
  margin-top:58px;
}
.contact-block__link{
  font-family:var(--font-body); color:var(--grey-light);
  font-size:clamp(15px,1.7vw,18px); text-decoration:none; word-break:break-word;
  transition:color var(--dur-fast) var(--ease-out);
}
.contact-block__link:hover, .contact-block__link:focus-visible{ color:var(--maroon); }
/* ---------- Ways to Give: bank account card (left column) ---------- */
.bank-card{
  position:relative;
  width:100%; max-width:420px;
  min-height:210px;
  border-radius:18px;
  padding:20px 22px 24px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,0.1), transparent 55%),
    linear-gradient(135deg, #4a4c52 0%, #2c2d31 30%, #17181a 55%, #232427 78%, #35363a 100%);
  border:1px solid rgba(255,255,255,0.16);
  box-shadow:0 18px 40px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.12) inset;
  display:flex; flex-direction:column; justify-content:flex-start; gap:22px;
  overflow:hidden;
}
.bank-card::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,0.07), transparent 30%);
}
.bank-card__logo{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; position:relative; z-index:1; }
.bank-card__logo-badge{
  display:inline-flex; align-items:center;
  background:rgba(255,255,255,0.96); border-radius:7px;
  padding:5px 9px;
}
.bank-card__logo-img{ height:clamp(50px,3vw,26px); width:auto; display:block; }
.bank-card__logo-sub{ font-family:var(--font-body); font-weight:700; font-size:9px; letter-spacing:0.14em; color:rgba(255,255,255,0.7); margin-left:2px; }
.bank-card__details{ display:flex; flex-direction:column; gap:18px; position:relative; z-index:1; }
.bank-card__field{ display:flex; flex-direction:column; gap:4px; }
.bank-card__label{
  font-family:var(--font-body); font-weight:400; font-size:clamp(11px,1.4vw,13px);
  color:rgba(255,255,255,0.65); margin:0; letter-spacing:0.01em;
}
.bank-card__sublabel{
  font-family:var(--font-body); font-weight:400; font-size:clamp(11px,1.4vw,13px);
  color:rgba(255,255,255,0.65); margin:0 0 2px; letter-spacing:0.01em;
}
.bank-card__row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.bank-card__name{
  font-family:var(--font-body); font-weight:800; font-size:clamp(13px,1.7vw,16px);
  color:#ffffff; letter-spacing:0.01em; word-break:break-word;
}
.bank-card__number{
  font-family:var(--font-body); font-weight:800; font-size:clamp(16px,2.4vw,22px);
  color:#ffffff; letter-spacing:0.02em; word-break:break-word;
}
.bank-card__copy{
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3);
  color:rgba(255,255,255,0.85); width:26px; height:26px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  cursor:pointer; padding:0; transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.bank-card__copy svg{ width:14px; height:14px; }
.bank-card__copy:hover, .bank-card__copy:focus-visible{ background:var(--maroon); border-color:var(--maroon); color:var(--white); }

.bank-card__toast{
  position:absolute; top:16px; right:18px; z-index:2;

  padding:5px 10px; border-radius:20px;
  opacity:0; transform:translateY(-6px); pointer-events:none;
  transition:opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
}
.bank-card__toast.is-visible{ opacity:1; transform:translateY(0); }
@media (max-width:760px){
  .bank-card{ max-width:100%; min-height:190px; aspect-ratio:auto; padding:16px 18px 20px; gap:16px; }
}
.accountability-box{ margin-bottom:36px; }
.accountability-box .acc-item__trigger{ font-size:15.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:18px 2px; }
.accountability-box .acc-item__panel-inner{ font-size:14.5px; line-height:1.8; }

/* ---------- 9. FAQ ---------- */
.faqsec{
  background-color:var(--black);
  background-size:cover; background-position:center; background-repeat:no-repeat;
  padding:80px 24px 100px;
}
@media (max-width:760px){ .faqsec{ padding:56px 20px 48px; } }
.faqsec__inner{ max-width:1100px; margin:0 auto; display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:start; }
@media (max-width:760px){ .faqsec__inner{ grid-template-columns:1fr; } }
.faqsec__side{ text-align:left; }
@media (max-width:760px){ .faqsec__side{ order:-1; } }
.faqsec__header-img-wrap{ width:100%; }
.faqsec__header-img{ display:block; width:100%; max-width:420px; height:auto; }
.faqsec__illustration{ border-radius:10px; overflow:hidden; aspect-ratio:3/2; max-width:360px; margin:0 auto; }
.faqsec__illustration img{ width:100%; height:100%; object-fit:cover; display:block; }
.faqsec__illustration.is-video{ aspect-ratio:16/9; max-width:420px; position:relative; margin-top:8px; }
.faqsec__illustration.is-video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.faq-box{
  border:1px solid var(--grey-line); border-radius:14px;
  margin-bottom:14px; overflow:hidden;
  transition:border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.faq-box:hover, .faq-box:focus-within, .faq-box:active{
  border-color:var(--maroon); background-color:rgba(153,40,40,0.16);
}
.faq-box .acc-item__trigger:active{ background-color:rgba(153,40,40,0.26); }
.faq-box .acc-item{ border-bottom:none; }
.faq-box .acc-item__trigger{ padding:19px 20px; font-size:15px; text-align:left; }
.faq-box .acc-item__panel-inner{ padding:0 20px 20px; font-size:14.5px; text-align:left; }

/* FAQ section sits over a background image — matching the reference,
   boxes stay nearly transparent at rest (just the border shows), and
   only pick up a readable fill once opened so the answer text stays
   legible against whatever photo is behind it. */
.faqsec .faq-box{
  background-color:rgba(10,10,10,0.62);
  border-color:rgba(255,255,255,0.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.faqsec .faq-box:hover, .faqsec .faq-box:focus-within, .faqsec .faq-box:active{
  background-color:rgba(153,40,40,0.22);
}
.faqsec .faq-box:has(.acc-item__trigger[aria-expanded="true"]){
  background-color:rgba(10,10,10,0.82);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}

/* ---------- 9b. WHAT WE BELIEVE (styled like the FAQ dropdown) ---------- */
.believesec{ position:relative; background:var(--black); background-size:cover; background-position:center; padding: 20px 24px 40px; text-align:left; overflow:hidden; }
.believesec__scrim{ position:absolute; inset:0; z-index:0; background:rgba(10,10,10,0.55); pointer-events:none; }
.believesec__inner{ position:relative; z-index:1; max-width:900px; margin:0 auto; text-align:left; }
.believesec__title{ font-family:var(--font-display); font-size:clamp(40px,7vw,64px); font-weight:400; line-height:0.95; letter-spacing:-0.08em; margin:0 0 18px; color:var(--grey-light); }
.believesec__title em{ font-style:italic; font-weight:400; color:var(--maroon); }
.believesec__intro{ font-size:16px; line-height:1.8; color:var(--grey-light); margin:0 0 34px; max-width:760px; text-align:left; }
.believesec__verses{ margin-top:26px; display:flex; flex-wrap:wrap; gap:6px 16px; }
.believesec__verse{
  display:inline-block; font-size:clamp(12.5px, 1.3vw, 14px); letter-spacing:0.02em;
  text-decoration:underline; text-underline-offset:3px; color:rgba(255,255,255,0.6);
}
.believesec__verse:hover{ color:var(--maroon); }
.believesec__verse.is-hidden{ display:none; }
.believesec__more{
  display:inline-flex; align-items:center; justify-content:center;
  margin:0; padding:6px 14px;
  font-family:var(--font-body); font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
  color:#9f9f9f; text-decoration:none; cursor:pointer;
  border:1px solid #3b3b3b; border-radius:999px; background:transparent;
  transition:background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.believesec__more:hover, .believesec__more:focus-visible{
  background-color:var(--maroon); border-color:var(--maroon); color:var(--white);
}

/* ---------- 12. FOOTER ---------- */
.site-footer{
  background:var(--black); border-top:1px solid var(--grey-line);

}

}

.site-footer__links a{

.site-footer__bottom{

  position:relative; z-index:1;
}
.site-footer__copy{ font-size:12.5px; color:rgba(255,255,255,0.45); margin:0; }

  .site-footer__nav{ gap:40px; }

}

/* ============================================================
   RESTRUCTURE ADDITIONS — Upcoming Gatherings, Ways to Give
   redesign, Why This City, Stay Connected. Re-uses the existing
   tokens, fonts, maroon callout and accordion treatments.
   ============================================================ */
.gatherings__title, .why-city__title, .connect__title{
  font-family:var(--font-display); font-size:clamp(40px,7vw,64px); font-weight:400;
  line-height:0.95; letter-spacing:-0.08em; margin:0 0 34px; color:var(--grey-light); padding-top:0.12em;
}
@media (max-width:400px){ .gatherings__title, .why-city__title, .connect__title{ font-size:32px; } }

/* ---- Upcoming Gatherings ---- */
.gatherings{ background:var(--black); padding:70px 24px 50px; position:relative; z-index:2; }

.gather-card__event-name{ margin:0 0 2px; font-family:var(--font-body); font-size:15px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase; color:var(--white); }
.gather-card__event-sub{ margin:0 0 2px; font-family:var(--font-body); font-size:12.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--maroon); }
.gather-card__event-time{ margin:0; font-family:var(--font-body); font-size:15px; color:var(--grey-light); }
.gather-card__venue{ margin:auto 0 0; padding-top:4px; font-family:var(--font-body); font-size:14.5px; font-weight:600; color:var(--grey-light); letter-spacing:0.02em; }

/* ---- Why This City ---- */
.why-city__head{ max-width:1180px; margin:0 auto 52px; }

<script>
(function(){
  "use strict";
  const navbar = document.getElementById('navbar');
  const navToggle = document.getElementById('navToggle');
  function closeNavMenu(){
    navbar.classList.remove('is-open');
    if(navToggle) navToggle.setAttribute('aria-expanded','false');
  }
  function onScrollNav(){
    navbar.classList.toggle('scrolled', window.scrollY > 50);
    const isCompact = window.innerWidth <= 640 ? true : (window.scrollY >= window.innerHeight * 0.9);
    const wasCompact = navbar.classList.contains('navbar--compact');
    navbar.classList.toggle('navbar--compact', isCompact);
    if(!isCompact && wasCompact) closeNavMenu();
  }
  window.addEventListener('scroll', onScrollNav, { passive:true });
  window.addEventListener('resize', onScrollNav);
  onScrollNav();
  if(navToggle){
    navToggle.addEventListener('click', ()=>{
      const o = navbar.classList.toggle('is-open');
      navToggle.setAttribute('aria-expanded', String(o));
    });
    document.addEventListener('click', e=>{ if(navbar.classList.contains('is-open') && !navbar.contains(e.target)) closeNavMenu(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeNavMenu(); });
  }
  const fy=document.getElementById('footerYear'); if(fy) fy.textContent=new Date().getFullYear();

  const FAQ = [
    { q: "Who can join the launch crew?", a: "Anyone who is willing to be a part of COUNTER CULTURE and support with whatever you can contribute is welcome, regardless of their level of spiritual maturity. The only condition is a spirit of teachability: a willingness to learn a new culture rooted in Scripture and the humility to unlearn old mindsets that do not align with the culture & vision we are building." },
    { q: "How will I grow spiritually if the services won’t start until next year?", a: "Before we start weekly services, we will have regular avenues to seek God through Scripture-based teaching, prayer and worship, and activation focused on deepening our personal relationship with God and strengthening the culture of our church community. We will have an intentional & undistracted time of growing deeper in your relationship with God in a different way." },
    { q: "What level of involvement or intensity is expected from the launch crew?", a: "We have a culture of willing participation; we only want you to be as involved as what you want to commit to. A common misconception is that the entire team carries the spiritual weight of pioneering; in reality, the Senior Pastors carry the primary responsibility for it. Everyone is free to support the mission in a way that fits their capacity and the level of commitment you are comfortable with." },
    { q: "What will the monthly schedule look like?", a: "We will most likely have regular internal launch crew gatherings on either Tuesday nights or Saturdays. Other weekdays we will spend time building relationships, discussing our culture, studying the scriptures, praying & worshipping, and training for the season ahead. Some Sundays Paul & Janine are going to minister to different churches which the launch crew will be invited to come to. Some Sundays we will observe & learn from churches around our region and online." },
    { q: "What’s the difference between joining the launch crew vs joining the church when the services launch? Why join early if I can wait for next year?", a: "You can join the launch crew at any point in the next 6 to 9 months, which means you can still join next year. Joining any church with momentum and traction is definitely easier, but there are only a few things as rewarding as witnessing God build a church firsthand with a few people who are willing to say yes and see the beauty and mess of starting something. Being a part of the launch crew lets you see the history of the church and gives you memories you will keep for a lifetime. There is nothing wrong with joining when Sunday services start, but the closeness and rawness of the launch crew will be special. For those who have a heart for ministry, there is no better training avenue than pioneering a church. We will discuss the full leadership development process, which will include a ministry certification, at our interest nights." },
    { q: "What if I have never pioneered or been a part of starting anything before?", a: "You need no prior experience to be a part of a launch team. We are not looking for people who are skilled, we are looking for a few who are hungry and teachable." },
    { q: "What If I’m really not sure and I need more clarity?", a: "It's hard to know if you're supposed to get in a boat until you know its specific destination. That’s why we encourage you to sign up for a Vision & Interest Night at the link below. You can send your questions ahead of time or ask them when you arrive." },
    { q: "Do I need to live in QC to be a part of the launch crew?", a: "Not necessarily, though it will be easier if you live in Quezon City, as we are currently holding our meetings around the TriNoma/SM North EDSA area. There are already people planning to be a part of the launch crew coming from Makati, Parañaque, Caloocan, and Pasig. We have a desire to reach Metro Manila and we have faith that people will come from other cities to encounter the presence of God and build the Kingdom in a church located at a very accessible spot in Quezon City." },
    { q: "How can I know if I can handle being a part of the launch crew? How much will it cost me?", a: "The encouraged meetings will happen once a week, and everything will be recorded online if you can't make it. The next six months will be like having internal team and leadership meetings focused on getting a deeper revelation of the spiritual direction of the church, building culture and relationships, and going deeper in our discipleship and healing journey. We will give more to those who express the desire to do more, but from a baseline, the next 6 will practically be a time where we spend 80% spiritually receiving, learning/unlearning, and training, and around 20% outputting, serving, and doing outreach. In the last 2-3 months before launch Sunday, the launch crew will serve and do more outreach as we prepare for Sunday services. So ask yourself if you can handle a season of spiritual pursuit & pruning to build deep, and then pouring out more to reach wide towards the launch. Being a part of the launch crew means we need to pay the cost of building strong foundations for our own spiritual walk—and for the people coming as we launch." },
  ];
  function toYouTubeEmbed(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
    if(!m) return url; // not a recognizable YouTube URL — use as-is
    const id = m[1];
    // Error 153 ("video player configuration error") is almost always an
    // origin mismatch: YouTube checks the `origin` param against the page
    // that's actually loading it. Setting it dynamically here (instead of
    // a hardcoded/copy-pasted embed URL) means it always matches wherever
    // this page is really hosted. youtube-nocookie.com is used for the
    // same reason it's recommended in most fixes for this error — it
    // sidesteps some of the cookie/tracking checks that can trip up the
    // handshake in privacy-strict browsers.
    const params = new URLSearchParams({
      rel: '0',
      modestbranding: '1',
      playsinline: '1',
      enablejsapi: '1',
      origin: window.location.origin
    });
    return `https://www.youtube-nocookie.com/embed/${id}?${params.toString()}`;
  }

  function buildAccordionGroup(items, groupEl, itemClass){
    items.forEach(({title, body})=>{
      const item = document.createElement('div');
      item.className = 'acc-item' + (itemClass ? ' ' + itemClass : '');
      item.innerHTML = `
        <button class="acc-item__trigger" aria-expanded="false">
          <span>${title}</span>
          <span class="acc-item__icon" aria-hidden="true"></span>
        </button>
        <div class="acc-item__panel">
          <div class="acc-item__panel-inner">${body}</div>
        </div>
      `;
      groupEl.appendChild(item);
    });
    wireAccordionGroup(groupEl);
  }

  function wireAccordionGroup(groupEl){
    const items = Array.from(groupEl.querySelectorAll('.acc-item'));
    items.forEach(item=>{
      const trigger = item.querySelector('.acc-item__trigger');
      const panel = item.querySelector('.acc-item__panel');
      trigger.addEventListener('click', ()=>{
        const isOpen = item.classList.contains('open');
        // close all in this group
        items.forEach(other=>{
          other.classList.remove('open');
          other.querySelector('.acc-item__trigger').setAttribute('aria-expanded','false');
          other.querySelector('.acc-item__panel').style.height = '0px';
        });
        if(!isOpen){
          item.classList.add('open');
          trigger.setAttribute('aria-expanded','true');
          panel.style.height = panel.scrollHeight + 'px';
        }
      });
    });
  }

  
  buildAccordionGroup(FAQ.map(f=>({ title:f.q, body:f.a })), document.getElementById('faqCols'), 'faq-box');
  const FAQ_VIDEO_URL = "https://youtu.be/klWodiDgILQ?si=xFVi3Ifc2Ni2kaGo";
  const faqIllustration = document.getElementById('faqIllustration');
  if(FAQ_VIDEO_URL && faqIllustration){
    const faqEmbedUrl = toYouTubeEmbed(FAQ_VIDEO_URL);
    faqIllustration.classList.add('is-video');
    const faqIframe = document.createElement('iframe');
    faqIframe.src = faqEmbedUrl; // built entirely from FAQ_VIDEO_URL above — nothing hardcoded here
    faqIframe.title = 'YouTube video player';
    faqIframe.setAttribute('frameborder', '0');
    faqIframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
    faqIframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    faqIframe.setAttribute('allowfullscreen', '');
    faqIllustration.appendChild(faqIframe);
  }

})();
</script>
</body>
</html>
