<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="description" content="Sign up for a COUNTERCULTURE Vision & Interest Night.">
<script async src="https://tally.so/widgets/embed.js"></script>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#0a0a0a; color:#ffffff; font-family:'Public Sans', ui-sans-serif, system-ui, sans-serif; }

  .interested__header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border-bottom:1px solid rgba(255,255,255,0.14);
  }
  .interested__back{
    color:#ffffff; text-decoration:none; font-size:14px; font-weight:600;
    letter-spacing:0.02em; opacity:0.85;
  }
  .interested__back:hover{ opacity:1; color:#992828; }
  .interested__wordmark{ font-size:14px; font-weight:800; letter-spacing:0.08em; }

  .interested__frame-wrap{
    max-width:760px; margin:28px auto 0; padding:0 16px 40px;
  }
  iframe{
    width:100%;
    height:1250px;
    border:0;
    border-radius:12px;
    background:transparent;
  }
  @media (max-width:600px){
    iframe{ height:1500px; }
  }
</style>
</head>
<body>

  <header class="interested__header">
    <a href="index.html" class="interested__back">&larr; Back </a>
    <span class="interested__wordmark">COUNTER CULTURE</span>
  </header>
 
  <div class="interested__frame-wrap">
    <iframe
      data-tally-src="https://tally.so/r/WOXQOL?transparentBackground=1"
      loading="lazy"
      width="100%"
      title="Vision & Interest Night Sign Up">
    </iframe>
  </div>

  <script>
    // Fallback: if the Tally embed script hasn't swapped in the real
    // src within a second (e.g. blocked script), load it directly so
    // the form still appears instead of staying blank.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var f = document.querySelector('iframe[data-tally-src]');
        if (f && !f.src) {
          f.src = f.getAttribute('data-tally-src');
        }
      }, 1200);
    });
  </script>

</body>
</html>
